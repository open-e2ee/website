name: Deploy

# Production deploy of open-e2ee.dev. Runs on every push to main once CI-style
# checks pass locally in the job; also manually dispatchable.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Cloudflare
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install from the committed lockfile
        run: npm ci

      # Build first: the dist-reading test guards fail on an unbuilt tree when
      # CI is set, so the suite must always run against the artifact this job
      # is about to ship.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

name: Deploy

# Production deploy of open-e2ee.dev. A published GitHub release deploys the
# commit that its tag points to. A manual run names the tag. The tag must be a
# calendar version (vYYYY.MM.DD, or vYYYY.MM.DD-N for a second release on the
# same day), and its commit must be on main. A push to main deploys the staging
# lane in deploy-staging.yml, never this one.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy (vYYYY.MM.DD or vYYYY.MM.DD-N)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Require a calendar release tag
        run: |
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v20[0-9]{2}\.[0-9]{2}\.[0-9]{2}(-[0-9]+)?$'; then
            echo "::error title=Production deploy refused::Tag '$RELEASE_TAG' is not vYYYY.MM.DD or vYYYY.MM.DD-N."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Require the tag commit on main
        run: |
          commit=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error title=Production deploy refused::Tag $RELEASE_TAG points to $commit, which is not on main."
            exit 1
          fi
          echo "Deploying $RELEASE_TAG at $commit."

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm

      - name: Install from the committed lockfile
        run: npm ci

      # Build first: the dist-reading test guards fail on an unbuilt tree when
      # CI is set, so the suite must always run against the artifact this job
      # is about to ship.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

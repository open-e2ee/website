name: Deploy

# Production deploy of open-e2ee.dev. Runs on every push to main once CI-style
# checks pass locally in the job; also manually dispatchable.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm

      - name: Install from the committed lockfile
        run: npm ci

      # Build first: the dist-reading test guards fail on an unbuilt tree when
      # CI is set, so the suite must always run against the artifact this job
      # is about to ship.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

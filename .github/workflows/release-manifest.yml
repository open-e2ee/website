name: Attest public release manifest

on:
  push:
    branches: [main]
    paths:
      - public/releases/open-e2ee-relay-public-beta-v1.json

permissions:
  contents: read

jobs:
  attest:
    name: Validate and attest release manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install from the committed lockfile
        run: npm ci

      - name: Verify the website and exact manifest contract
        run: |
          npm run build
          npm test
          npm run release:manifest:verify -- public/releases/open-e2ee-relay-public-beta-v1.json

      - name: Attest the public manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: public/releases/open-e2ee-relay-public-beta-v1.json

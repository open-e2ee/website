name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # The demo smoke run launches Chrome and drives a full handshake twice,
    # which is the slowest thing in this workflow by an order of magnitude.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The build first, then the node suite. The suite ran first for speed
      # until 2026-08, but many of its assertions read dist/ behind an
      # `if (!dist) return` guard, so test-before-build made every one of them
      # a silent skip on each push — the suite passed without checking the
      # rendered pages at all. With the build first the guards have a dist to
      # read, and the suite fails in CI (process.env.CI) if dist/ is absent,
      # so this ordering cannot silently regress.
      #
      # The suite is still its own step, not a side effect of the Wrangler dry
      # run below — `deploy:redirect:dry-run` starts with `npm test`, and
      # trimming that `&&` must not take the suite with it.
      - run: npm run build

      - run: npm test

      # The homepage demo, driven in a real browser against the build above.
      # It is the only check that can see the two things the page promises a
      # reader they can verify themselves — that the round trip happens in
      # their tab, and that their sentence never leaves it — so a red run has
      # to stop the pull request. `chrome-harness.mjs` finds the Chrome that
      # ubuntu-latest ships at /usr/bin/google-chrome, and says which paths it
      # looked at if a future image drops it. Exit 1 is the demo failing and
      # exit 2 is the harness failing; both fail this job, because a check that
      # cannot run is not a check that passed.
      - run: npm run demo:smoke

      - run: npm run deploy:redirect:dry-run

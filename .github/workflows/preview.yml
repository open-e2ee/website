name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  deployments: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install from the committed lockfile
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload preview
        id: preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: versions upload --env preview --preview-alias pr-${{ github.event.pull_request.number }}

      - name: Add preview link to the job summary
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.deployment-url }}
        run: |
          {
            echo "### Cloudflare preview"
            echo
            echo "[$PREVIEW_URL]($PREVIEW_URL)"
          } >> "$GITHUB_STEP_SUMMARY"

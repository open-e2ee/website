<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Adaptive OpenE2EE mark</title>
  <desc id="desc">Two open carrier brackets holding a solid square payload. The payload touches neither bracket. The fill follows the active color scheme.</desc>
  <style>
    :root { --oe-mark: #090806; }
    @media (prefers-color-scheme: dark) {
      :root { --oe-mark: #f4f1eb; }
    }
    @media (forced-colors: active) {
      path { fill: CanvasText; }
    }
  </style>
  <path d="M64 64 H208 V112 H112 V400 H208 V448 H64 Z" fill="var(--oe-mark)"/>
  <path d="M448 64 H304 V112 H400 V400 H304 V448 H448 Z" fill="var(--oe-mark)"/>
  <path d="M152 152 H360 V360 H152 Z" fill="var(--oe-mark)"/>
</svg>

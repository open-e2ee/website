<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">OpenE2EE</title>
  <desc id="desc">Two open carrier brackets holding a solid square payload. Small-size optical variant, drawn without the shear. The fill follows the active color scheme.</desc>
  <style>
    :root { --oe-mark: #090806; }
    @media (prefers-color-scheme: dark) {
      :root { --oe-mark: #f4f1eb; }
    }
    @media (forced-colors: active) {
      path { fill: CanvasText; }
    }
  </style>
  <path d="M56 56 H200 V112 H112 V400 H200 V456 H56 Z" fill="var(--oe-mark)"/>
  <path d="M456 56 H312 V112 H400 V400 H312 V456 H456 Z" fill="var(--oe-mark)"/>
  <path d="M152 152 H360 V360 H152 Z" fill="var(--oe-mark)"/>
</svg>
